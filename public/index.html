<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hw for sale</title>
    <link rel="icon" href="https://static.wikia.nocookie.net/a6357f3f-fc19-4295-84b6-b7fe99ca0b74/scale-to-width/755" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <style>
        .marquee {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: #f8d210; /* Light background for visibility */
            padding: 10px 0;
            font-size: 20px;
            font-weight: bold;
            position: relative;
        }
        
        .marquee span {
            color: black;
            display: inline-block;
            min-width: 100vw; /* Ensures text is wide enough */
            white-space: nowrap;
            animation: marquee 10s linear infinite;
        }
        
        @keyframes marquee {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">📚 hw for sale</a></h1>
    </header>
    <div class="marquee">
        <span>GRAND OPENING! BUY NOW</span>
    </div>
        
    <main>
        <section id="hot-products" class="product-container"></section>
        <section id="other-products" class="product-container"></section>
    </main>
        
    <footer>
        &copy; 2024 hw for sale
    </footer>
        
    <script>
        async function fetchProducts() {
            try {
                const response = await fetch('/.netlify/functions/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ none: true })
                });
    
                if (!response.ok) throw new Error('Failed to fetch products');
    
                return await response.json();
            } catch (error) {
                console.error("Error fetching products:", error);
                return null;
            }
        }

        function generateRandomString(length = 20) {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }
        
        // Check if an ID is already stored, if not, generate and store one
        if (!localStorage.getItem("id")) {
            localStorage.setItem("id", JSON.stringify(generateRandomString())); // Call the function
        }
        
        // Retrieve and parse the stored ID
        const userID = JSON.parse(localStorage.getItem("id"));
    
        document.addEventListener('DOMContentLoaded', async () => {
            const products = await fetchProducts();
            if (!products) return;
    
            const hotProductsContainer = document.getElementById('hot-products');
            const otherProductsContainer = document.getElementById('other-products');
    
            Object.keys(products).forEach(productId => {
                const product = products[productId];
    
                const article = document.createElement('article');
                article.classList.add('product');
                article.id = productId;
    
                const label = document.createElement('div');
                label.classList.add('product-label');
                label.textContent = product.hot ? '🔥 hot deal 🔥' : 'ㅤㅤㅤㅤㅤㅤ'; // Blank label for non-hot products
                if (product.hot) label.classList.add('hot-deal');
                article.appendChild(label);
    
                const img = document.createElement('img');
                img.src = product.img;
                img.alt = product.name || 'Product Image';
                article.appendChild(img);
    
                const h2 = document.createElement('h2');
                h2.textContent = product.name;
                article.appendChild(h2);
    
                const p = document.createElement('p');
                p.textContent = `cost: ${product.hot ? `🔥 ${product.price}` : product.price}`;
                article.appendChild(p);
    
                const button = document.createElement('button');
                button.textContent = 'check it out';
                button.onclick = () => window.location.href = `/product?id=${productId}`;
                article.appendChild(button);
    
                if (product.hot) {
                    hotProductsContainer.appendChild(article);
                } else {
                    otherProductsContainer.appendChild(article);
                }
            });
        });
    </script>
</body>
</html>
