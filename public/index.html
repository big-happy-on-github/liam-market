<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hw for sale</title>
    <link rel="icon" href="https://static.wikia.nocookie.net/a6357f3f-fc19-4295-84b6-b7fe99ca0b74/scale-to-width/755" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .footer-text {
            display: block;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            animation: scrollText 8s linear infinite;
        }
        @keyframes scrollText {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">hw for sale</a> 📚</h1>
        <br>
        <!-- Navigation is commented out; uncomment if needed -->
        <!-- <nav>
            <ul>
                <li>🔥<a href="hot">hot deals</a>🔥</li>
                <li><a href="math">math</a></li>
                <li><a href="other">english & spanish</a></li>
                <li><a href="feedback">ss</a></li>
            </ul>
        </nav> -->
    </header>

    <main>
        <section id="hot-products" class="product-container"></section>
        <section id="other-products" class="product-container"></section>
    </main>

    <footer>
        <span class="footer-text">&copy; 2024 Liam's Marketplace</span>
    </footer>

    <script>
        async function fetchProducts() {
            try {
                const response = await fetch('/.netlify/functions/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ none: true })
                });

                if (!response.ok) throw new Error('Failed to fetch products');
                
                return await response.json();
            } catch (error) {
                console.error("Error fetching products:", error);
                return null;
            }
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            const products = await fetchProducts();
            if (!products) return;

            const hotProductsContainer = document.getElementById('hot-products');
            const otherProductsContainer = document.getElementById('other-products');

            Object.keys(products).forEach(productId => {
                const product = products[productId];

                const article = document.createElement('article');
                article.classList.add('product');
                article.id = productId;

                if (product.hot) {
                    const hotTitle = document.createElement('h1');
                    hotTitle.textContent = '🔥 hot deal 🔥';
                    article.appendChild(hotTitle);
                }

                const img = document.createElement('img');
                img.src = product.img;
                img.alt = product.name || 'Product Image';
                article.appendChild(img);

                const h2 = document.createElement('h2');
                h2.textContent = product.name;
                article.appendChild(h2);

                const p = document.createElement('p');
                p.textContent = product.hot ? `🔥 $${product.price}` : `$${product.price}`;
                article.appendChild(p);

                const button = document.createElement('button');
                button.textContent = 'lemme buy it';
                button.onclick = () => window.location.href = `/product?id=${productId}`;
                article.appendChild(button);

                if (product.hot) {
                    hotProductsContainer.appendChild(article);
                } else {
                    otherProductsContainer.appendChild(article);
                }
            });
        });
    </script>
</body>
</html>
