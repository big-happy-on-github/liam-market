<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hw for sale admin menu</title>
    <link rel="icon" href="https://static.wikia.nocookie.net/a6357f3f-fc19-4295-84b6-b7fe99ca0b74/scale-to-width/755" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <style>
        .marquee {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: #f8d210; /* Light background for visibility */
            padding: 10px 0;
            font-size: 20px;
            font-weight: bold;
            position: relative;
        }
        
        .marquee span {
            color: black;
            display: inline-block;
            min-width: 100vw; /* Ensures text is wide enough */
            white-space: nowrap;
            animation: marquee 10s linear infinite;
        }
        
        @keyframes marquee {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">📚 hw for sale</a></h1>
    </header>
        
    <main>
        <div>
            <h2>orders</h2>
        </div>
    </main>
        
    <footer>
        &copy; 2024 hw for sale
    </footer>
        
    <script>
        async function fetchData() {
            const { data, error } = await supabaseClient
                .from("orders")
                .select("*");
        
            if (error) {
                console.error("Error fetching data:", error);
                return;
            }
        
            console.log("Fetched data:", data);
        }
        
        fetchData();
    </script>
</body>
</html>
