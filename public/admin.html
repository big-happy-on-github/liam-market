<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <style>
        .marquee {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: #f8d210; /* Light background for visibility */
            padding: 10px 0;
            font-size: 20px;
            font-weight: bold;
            position: relative;
        }
        
        .marquee span {
            color: black;
            display: inline-block;
            min-width: 100vw; /* Ensures text is wide enough */
            white-space: nowrap;
            animation: marquee 10s linear infinite;
        }
        
        @keyframes marquee {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">📚 hw for sale</a></h1>
    </header>
        
    <main>
        <div id="orders">
            <h2>orders</h2>
        </div>
    </main>
        
    <footer>
        &copy; 2024 hw for sale
    </footer>
        
    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    
        const supabase = createClient(
            'https://moijrxsiywjidkaqripc.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vaWpyeHNpeXdqaWRrYXFyaXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg4NjE5OTEsImV4cCI6MjA1NDQzNzk5MX0.rOC1-gAxHtlrOkHWdiR2eb_RRpuVhhCEdMKG5MLEHlc'
        );

        function generateRandomString(length = 20) {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }
        
        // Check if an ID is already stored, if not, generate and store one
        if (!localStorage.getItem("id")) {
            localStorage.setItem("id", generateRandomString()); // Call the function
        }
        
        // Retrieve and parse the stored ID
        const userID = localStorage.getItem("id");
        
        async function fetchData() {
            const { data, error } = await supabase
                .from("orders")
                .select("*");
        
            if (error) {
                console.error("Error fetching data:", error);
                return;
            }
        
            console.log("Fetched data:", data);
            data.forEach(order => {
                const div = document.createElement("div");
                const p = document.createElement("p");

                p.textContent = `date order placed: ${order.created_at}, name for the order: ${order.name}, location for food dropoff: ${order.location}, time for food dropoff: ${order.time}, phone/email: ${order.phoneEmail}`;
                div.appendChild(p);
                document.getElementById("orders").appendChild(div);
                document.getElementById("orders").appendChild(document.createElement("br"));
            });
        }
        
        fetchData();
    </script>
