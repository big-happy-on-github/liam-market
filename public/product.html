<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hw for sale</title>
    <link rel="icon" href="https://static.wikia.nocookie.net/a6357f3f-fc19-4295-84b6-b7fe99ca0b74/scale-to-width/755" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        header h1 a {
            color: #fff;
            text-decoration: none;
        }

        main {
            padding: 2rem;
            margin-top: 80px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .product-container {
            display: flex;
            justify-content: center;
        }
        
        .product {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        
        .product img {
            max-width: 100%;
            border-radius: 8px;
            border-bottom: 1px solid #ddd;
        }
        
        .product h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        .product h2 {
            font-size: 1.25rem;
            color: #333;
        }
        
        .product p {
            font-size: 1.125rem;
            margin: 1rem 0;
        }
        
        button {
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 1rem;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
            width: 100%;
            position: fixed;
            bottom: 0;
        }
        
        .footer-text {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            animation: scrollText 8s linear infinite;
        }

        @keyframes scrollText {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">hw for sale/a> 📚</h1>
    </header>

    <main>
        <section class="product-container" id="the-product">
            <article class="product" id="product">
                <h1 id="product-status">🔥 hot deal 🔥</h1>
                <img src="https://via.placeholder.com/200" alt="Product Image" id="product-img">
                <h2 id="product-name">Loading...</h2>
                <p id="product-price">$0.00</p>
                <button id="order-button">Complete Order</button>
            </article>
        </section>
    </main>

    <footer>
        <span class="footer-text">&copy; 2024 hw for sale</span>
    </footer>

    <script>
        async function fetchProduct() {
            try {
                const url = new URL(window.location.href);
                const params = new URLSearchParams(url.search);
                const productId = params.get('id');
                if (!productId) return;
                
                const response = await fetch('/.netlify/functions/products', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) throw new Error('Failed to fetch product');
                const products = await response.json();
                const product = products[productId];
                
                if (product) {
                    document.getElementById("product-img").src = product.img;
                    document.getElementById("product-name").textContent = product.name;
                    document.getElementById("product-price").textContent = `cost: $${product.price.toFixed(2)}`;
                    document.title += ` - ${product.name}`;

                    const status = document.getElementById("product-status");
                    if (!product.hot) {
                        status.remove();
                    }
                }
            } catch (error) {
                console.error("Error loading product:", error);
            }
        }
        
        document.addEventListener("DOMContentLoaded", fetchProduct);
    </script>
</body>
</html>
