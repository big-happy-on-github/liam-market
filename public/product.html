<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hw for sale</title>
    <link rel="icon" href="https://static.wikia.nocookie.net/a6357f3f-fc19-4295-84b6-b7fe99ca0b74/scale-to-width/755" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1><a href="/">hw for sale</a> 📚</h1>
    </header>

    <main>
        <section class="product-container"></section>
    </main>

    <footer>
        <span class="footer-text">&copy; 2024 hw for sale</span>
    </footer>

    <script>
        async function fetchProduct() {
            try {
                const url = new URL(window.location.href);
                const params = new URLSearchParams(url.search);
                const productId = params.get('id');
                if (!productId) return;
                
                const response = await fetch('/.netlify/functions/products', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) throw new Error('Failed to fetch product');
                const products = await response.json();
                const product = products[productId];
                if (!product) throw new Error('Product not found');
    
                const article = document.createElement('article');
                article.classList.add('product');
                article.id = productId;
    
                const label = document.createElement('div');
                label.classList.add('product-label');
                label.textContent = product.hot ? '🔥 hot deal 🔥' : 'ㅤㅤㅤㅤㅤㅤ'; // Blank label for non-hot products
                if (product.hot) label.classList.add('hot-deal');
                article.appendChild(label);
    
                const img = document.createElement('img');
                img.src = product.img;
                img.alt = product.name || 'Product Image';
                article.appendChild(img);
    
                const h2 = document.createElement('h2');
                h2.textContent = product.name;
                article.appendChild(h2);
    
                const p = document.createElement('p');
                p.textContent = `cost: ${product.hot ? `🔥 ${product.price}` : product.price}`;
                article.appendChild(p);
    
                const button = document.createElement('button');
                button.textContent = 'buy it';
                button.onclick = () => window.location.href = `/product?id=${productId}`;
                article.appendChild(button);
    
                document.querySelectorAll("section")[0].appendChild(article);
            } catch (error) {
                console.error("Error fetching product:", error);
            }
        }
    
        document.addEventListener("DOMContentLoaded", fetchProduct);
    </script>
</body>
</html>
