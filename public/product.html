<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hw for sale</title>
    <link rel="icon" href="https://static.wikia.nocookie.net/a6357f3f-fc19-4295-84b6-b7fe99ca0b74/scale-to-width/755" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1><a href="/">hw for sale</a> 📚</h1>
    </header>

    <main>
        <section class="product-container" id="the-product">
            <article class="product" id="product">
                <h1 id="product-status">🔥 hot deal 🔥</h1>
                <img src="https://via.placeholder.com/200" alt="Product Image" id="product-img">
                <h2 id="product-name">Loading...</h2>
                <p id="product-price">$0.00</p>
                <button id="order-button">Complete Order</button>
            </article>
        </section>
    </main>

    <footer>
        <span class="footer-text">&copy; 2024 hw for sale</span>
    </footer>

    <script>
        async function fetchProduct() {
            try {
                const url = new URL(window.location.href);
                const params = new URLSearchParams(url.search);
                const productId = params.get('id');
                if (!productId) return;
                
                const response = await fetch('/.netlify/functions/products', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) throw new Error('Failed to fetch product');
                const products = await response.json();
                const product = products[productId];
                if (!product) throw new Error('Product not found');
    
                // Get elements
                const productElement = document.getElementById("product");
                const productImg = document.getElementById("product-img");
                const productName = document.getElementById("product-name");
                const productPrice = document.getElementById("product-price");
                const orderButton = document.getElementById("order-button");
    
                // Update elements
                if (product.hot) {
                    document.getElementById("product-status").textContent = "🔥 hot deal 🔥";
                } else {
                    document.getElementById("product-status").textContent = "";
                }
    
                productImg.src = product.img;
                productImg.alt = product.name || 'Product Image';
                productName.textContent = product.name;
                productPrice.textContent = `Cost: ${product.hot ? `🔥 ${product.price}` : product.price}`;
                orderButton.textContent = "Lemme buy it";
                orderButton.onclick = () => window.location.href = `/product?id=${productId}`;
    
            } catch (error) {
                console.error("Error fetching product:", error);
            }
        }
    
        document.addEventListener("DOMContentLoaded", fetchProduct);
    </script>
</body>
</html>
