<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hw for sale, checkout</title>
    <link rel="icon" href="https://static.wikia.nocookie.net/a6357f3f-fc19-4295-84b6-b7fe99ca0b74/scale-to-width/755" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-container {
            display: flex;
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .product-image img {
            max-width: 400px;
            border-radius: 8px;
        }
        .product-details {
            flex: 1;
        }
        .product-details h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .product-details p {
            font-size: 1rem;
            margin: 1rem 0;
        }
        .price {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .buy-button {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-top: 1rem;
        }
        .buy-button:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>
    <header>
        <h1>📚 <a href="/">hw for sale</a></h1>
    </header>

    <main>
        <section class="product-container">
            <div class="product-image">
                <img id="product-img" src="" alt="Product Image">
            </div>
            <div class="product-details">
                <h2 id="product-name">Product Name</h2>
                <p id="product-description">Product description goes here.</p>
                <p class="price" id="product-price">$0.00</p>
                <button class="buy-button" id="buy-button">complete purchase</button>
            </div>
        </section>
    </main>

    <footer>
        <span class="footer-text">&copy; 2024 hw for sale</span>
    </footer>
    
    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    
        const supabase = createClient(
            'https://moijrxsiywjidkaqripc.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vaWpyeHNpeXdqaWRrYXFyaXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg4NjE5OTEsImV4cCI6MjA1NDQzNzk5MX0.rOC1-gAxHtlrOkHWdiR2eb_RRpuVhhCEdMKG5MLEHlc'
        );

        function generateRandomString(length = 20) {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }
        
        // Check if an ID is already stored, if not, generate and store one
        if (!localStorage.getItem("id")) {
            localStorage.setItem("id", generateRandomString()); // Call the function
        }
        
        // Retrieve and parse the stored ID
        const userID = localStorage.getItem("id");
        
        async function fetchProduct() {
            try {
                const url = new URL(window.location.href);
                const params = new URLSearchParams(url.search);
                const productId = params.get('id');
                if (!productId) return;
                
                const response = await fetch('/.netlify/functions/products', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) throw new Error('Failed to fetch product');
                const products = await response.json();
                const product = products[productId];
                if (!product) throw new Error('Product not found');

                document.getElementById('product-img').src = product.img;
                document.getElementById('product-name').textContent = product.hot ? `🔥 ${product.name} 🔥` : product.name;
                document.getElementById('product-description').textContent = product.description || 'No description available.';
                document.getElementById('product-price').textContent = product.hot ? `cost: 🔥${product.price}` : `cost: ${product.price}`;
                document.getElementById('buy-button').onclick = () => complete(productId, product);
            } catch (error) {
                console.error("Error fetching product:", error);
            }
        }

        async function complete(productId, product) {
            let name;
            let location;
            let time;
            let phoneEmail;
            while (!name || !location || !time || !phoneEmail) {
                name = prompt("name for the order");
                location = prompt(`location for the pickup of the ${product.price} (be specific)`);
                time = prompt(`datetime for the pickup of the ${product.price} (be specific)`);
                phoneEmail = prompt(`phone/email to recieve hw after the ${product.price} has been dropped off`);
                if (!name || !location || !time || !phoneEmail) {
                    alert("it seems you didn't answer one of the prior questions. Requestioning...");
                }
            }
            const discount = prompt("do you have a discount code? If not, press cancel");
            alert("if the order is unable to be completed, we will contact you via phone/email");

            const { data, error } = await supabase
                .from('orders')
                .insert([
                    { name: name, location: location, time: time, phoneEmail: phoneEmail, product: product, userID: userID }
                ]);
        
            if (error) {
                console.error('Error inserting row:', error.message);
            } else {
                console.log('Inserted row:', data);
                alert("order completed! Thank you");
                window.location.href = "/";
            }
        }

        document.addEventListener("DOMContentLoaded", fetchProduct);
    </script>
</body>
</html>
